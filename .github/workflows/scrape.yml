name: scrape
on:
  schedule:
    - cron: "17 */6 * * *"      # every 6 hours; in-force bulletins are weekly, so this is plenty
  workflow_dispatch:
permissions:
  contents: write
concurrency: scrape
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m navwarn.run
        env:
          NAVWARN_UA: "navwarn-archive/0.1 (+https://github.com/${{ github.repository }}; scheduled, 4x/day)"
      - run: python -m navwarn.build_index
      - name: commit if changed
        run: |
          git config user.name "navwarn-bot"
          git config user.email "navwarn-bot@users.noreply.github.com"
          git add -A raw warnings index
          git diff --cached --quiet || git commit -m "scrape $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
